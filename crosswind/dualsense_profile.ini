; ==============================================================================
; CROSSWIND: GROUND EFFECT — DualSense 6-Axis & Haptic Bridge Profile
; Compatible with vibrant-darwin Win32 USB HID Proxy Architecture
; ==============================================================================

[Device]
VendorID=0x054C
ProductID=0x0CE6,0x0DF2
PollingRateHz=250
AsyncOverlappedIO=1

[AerodynamicYoke]
; Left Trigger (L2) — Elevator Pitch Control & Aerodynamic Dynamic Pressure Resistance
; Mode 0x21 = Constant static resistance force that stiffens with indicated airspeed
TriggerModeL2=0x21
MinResistanceCount=25
MaxResistanceCount=235
VNE_Speed_Kts=220.0

; Right Trigger (R2) — Differential Throttle & Reverse Thrust Detent
; Mode 0x21 with mechanical gate at 80% pull for reverse thrust latch
TriggerModeR2=0x21
ReverseThrustGateCount=195

[PreStallBuffet]
; Airframe buffet vibration on stick prior to critical angle-of-attack
StallBuffetEnabled=1
TriggerModeBuffet=0x26
BuffetFrequencyHz=32
BuffetThresholdAlphaDeg=14.5
BuffetMotorAmplitude=210

[TouchdownHaptics]
; Granular runway contact and tire compression shockwave
TouchdownImpulseEnabled=1
TouchdownImpulseDurationMs=120
MaxTouchdownImpulseForce=255
StereoAsymmetricTouchdown=1 ; Left/Right wheel haptic separation

[FlightGyro]
; DualSense 6-axis gyro yoke emulation (pitch tilt and roll yoke turn)
GyroYokeEnabled=1
RollSensitivity=1.35
PitchSensitivity=1.20
OneEuroFilter_FcMin=1.20
OneEuroFilter_Beta=0.040
PerlinSmootherstepBlend=1
ReclineImmunityThresholdDeg=30.0
